  petrify(s) { // recolour into a little moss-flecked stone statue
    for (let i = 0; i < s.w * s.h; i++) { const q = i * 4; if (!s.c[q + 3]) continue; const l = (s.c[q] * .3 + s.c[q + 1] * .59 + s.c[q + 2] * .11) / 255; const st = PAL.stone[clamp(Math.round(l * 6.5), 0, 6)]; s.c[q] = st[0]; s.c[q + 1] = st[1]; s.c[q + 2] = st[2]; s.m[i] = MAT.STONE; if (hash2(i, 7, 3) < .04) { const m = PAL.moss[3]; s.c[q] = m[0]; s.c[q + 1] = m[1]; s.c[q + 2] = m[2]; } }
  },
  tailGlow(s, n) { // fur warms toward amber with each unit she carries
    const k = n / 6; for (let i = 0; i < s.w * s.h; i++) { if (s.m[i] !== MAT.FUR || !s.c[i * 4 + 3]) continue; const x = i % s.w, y = (i / s.w) | 0; if (y < 26) continue; const q = i * 4; s.c[q] = Math.min(255, s.c[q] + 40 * k); s.c[q + 1] = Math.min(255, s.c[q + 1] + 18 * k); s.e[i] = Math.round(2 * k); }
  },
};

/* ==== src/systems.js ==== */
/* =====================================================================
   SYSTEMS \u2014 what the walking does to the world, and the game's state.
   NEARMAP: every step wears a trail and gives a little nearness back
   to pale ground; a rebuilt shrine pushes a ring of it outward.
   GAME: time, weather, offerings, delivery, Far contact, saving.
   ===================================================================== */
const NEARMAP = {
  dirty: null,
  mark(i0, j0, i1, j1) { const d = this.dirty; if (!d) this.dirty = [i0, j0, i1, j1]; else { d[0] = Math.min(d[0], i0); d[1] = Math.min(d[1], j0); d[2] = Math.max(d[2], i1); d[3] = Math.max(d[3], j1); } },
  step(x, y, load) {
    const ci = Math.floor(x / 8), cj = Math.floor(y / 8); const R = 1;
    for (let j = cj - R; j <= cj + R; j++) for (let i = ci - R; i <= ci + R; i++) {
      if (i < 0 || j < 0 || i >= WD.nw || j >= WD.nh) continue; const k = j * WD.nw + i; const w = (i === ci && j === cj) ? 1 : .35;
      WD.wear[k] = Math.min(1, WD.wear[k] + .022 * w * (1 + load * .08));
      // walking gives nearness back only where the Far has thinned the world, never at the hard edge
      if (WD.near[k] > .14 && WD.near[k] < 1) WD.near[k] = Math.min(WD.nearMax ? WD.nearMax[k] : 1, WD.near[k] + .012 * w);
    }
    this.mark(ci - R, cj - R, ci + R, cj + R);
  },
  // a ring of nearness spreading from a point (the restored shrine)
  wave: null,
  startWave(x, y, r, to) { this.wave = { x, y, r: 0, R: r, to }; },
  update(dt) {
    const w = this.wave;
    if (w) { const r0 = w.r; w.r += dt * 90; const i0 = Math.floor((w.x - w.r) / 8), i1 = Math.ceil((w.x + w.r) / 8), j0 = Math.floor((w.y - w.r) / 8), j1 = Math.ceil((w.y + w.r) / 8);
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { if (i < 0 || j < 0 || i >= WD.nw || j >= WD.nh) continue; const d = hyp(i * 8 + 4 - w.x, j * 8 + 4 - w.y); if (d > w.r || d < r0 - 8) continue; const k = j * WD.nw + i; const tgt = w.to * (1 - sstep(w.R * .6, w.R, d)); if (WD.near[k] > .1 && WD.near[k] < tgt) WD.near[k] = tgt; }
      this.mark(Math.max(0, i0), Math.max(0, j0), Math.min(WD.nw - 1, i1), Math.min(WD.nh - 1, j1));
      if (w.r > w.R) this.wave = null; }
    if (this.dirty) { const d = this.dirty; RD.uploadNear(false, [clamp(d[0], 0, WD.nw - 1), clamp(d[1], 0, WD.nh - 1), clamp(d[2], 0, WD.nw - 1), clamp(d[3], 0, WD.nh - 1)]); this.dirty = null; }
  },
  // pale pockets left behind by the night of the Far
  scar(x, y, r, v) { for (let j = Math.floor((y - r) / 8); j <= (y + r) / 8; j++) for (let i = Math.floor((x - r) / 8); i <= (x + r) / 8; i++) { if (i < 0 || j < 0 || i >= WD.nw || j >= WD.nh) continue; const d = hyp(i * 8 + 4 - x, j * 8 + 4 - y) / r; if (d > 1) continue; const k = j * WD.nw + i; const nv = lerp(v, WD.near[k], sstep(.55, 1, d) * 1); if (WD.near[k] > .1) WD.near[k] = Math.min(WD.near[k], nv); } },
};

const GAME = {
  t: 0, dt: 0, tod: 17.4, day: 1, timeScale: 1 / 40, // one game hour per 40 s
  state: "boot", cine: false, flags: {}, tutorial: false,
  found: new Set(), count: 3, offerings: [],
  weather: { rain: 0, overcast: 0, mist: 0, wind: [1, .25, .3], target: { rain: 0, overcast: 0 }, next: 240 },
  canControl() { return this.state === "play" && !this.cine && !UI.blocking(); },
  /* ---------- time & weather ---------- */
  tick(dt) {
    this.t += dt; this.dt = dt;
    if (!this.todLock) { this.tod += dt * this.timeScale; if (this.tod >= 24) { this.tod -= 24; this.day++; } }
    const W = this.weather;
    W.next -= dt; if (W.next <= 0 && !this.cine) { W.next = 200 + Math.random() * 260; const r = Math.random(); W.target = r < .22 ? { rain: .6 + Math.random() * .4, overcast: .8 } : r < .45 ? { rain: 0, overcast: .5 } : { rain: 0, overcast: 0 }; }
    W.rain = approach(W.rain, W.target.rain, dt * .03); W.overcast = approach(W.overcast, W.target.overcast, dt * .04);
    const gust = .25 + .2 * Math.sin(this.t * .13) + .15 * Math.sin(this.t * .41) + W.rain * .3;
    W.wind = [.9, .3, clamp(gust, 0, 1)];
    // mist pools at dawn and after rain
    W.mist = clamp(1 - Math.abs(this.tod - 5.8) / 1.6, 0, 1) * .35 + W.rain * .2;
    WD.wet = clamp((WD.wet || 0) + (W.rain > .1 ? dt * .02 : -dt * .004), 0, 1);
  },
  env() { const W = this.weather; return todEnv(this.tod, { rain: W.rain, overcast: W.overcast, mist: W.mist + (this.extraMist || 0), wind: W.wind }); },
  /* ---------- offerings ---------- */
  collectOffering(o) {
    if (o.dead) return; o.dead = true; o.gone = true; this.found.add(o.idx); this.count = Math.min(99, this.count + 1);
    AU.sfx("offering"); FX.burst("glint", o.x, o.y, o.z + 4, 10, { life: .8, c: [1, .9, .6], speed: .6, up: 1, add: true, drag: 2 });
    const first = !this.flags["off_" + o.art]; this.flags["off_" + o.art] = true;
    UI.countPop(this.count, o.art, first);
    if (first) STORY.offering(o.art);
    this.save();
  },
  /* ---------- the shrine ---------- */
  deliver() {
    const P = PL.e; const it = P.stack[P.stack.length - 1]; if (!it || !SITE.accepts(it.kind)) return;
    P.stack.pop(); AU.sfx("build"); FX.stream([P.x, P.y, P.z + 30], [SITE.e.x, SITE.e.y, SITE.e.z + 16], [.95, .85, .6], 16);
    FX.burst("dust", SITE.e.x, SITE.e.y + 4, SITE.e.z, 10, { life: .6, c: [.7, .64, .54], speed: .7, up: .4, drag: 3, a: .7 });
    const advanced = SITE.give(it.kind);
    UI.siteCard(true);
    if (!advanced) STORY.bark("delivered", it.kind);
    this.save();
  },
  onPick(kind) {
    if (kind === "basket" && !this.flags.gotBasket) { this.flags.gotBasket = true; STORY.event("basket"); }
    if (kind === "holed" && !this.flags.gotHoled) { this.flags.gotHoled = true; STORY.event("holed"); }
    if (kind === "radio") STORY.bark("radioPick");
  },
  onWeight(how, target) {
    if (this.tutorial) STORY.tutorialWeight(how, target);
    if (!this.flags.knowsWeight) this.flags.knowsWeight = true;
  },
  onFarTouch(t) {
    if (this.t - (this.farSfxT || -9) > 2.2) { this.farSfxT = this.t; AU.sfx("far_touch", { x: PL.e.x, y: PL.e.y }); }
    if (t > .9 && !this.flags.farTouched) { this.flags.farTouched = true; STORY.event("farTouch"); }
    else if (t > 2.4 && Math.random() < .004) STORY.bark("farAgain");
  },
  /* ---------- saving ---------- */
  save() {
    if (this.state !== "play" || this.noSave) return;
    const P = PL.e;
    const items = EN.list.filter(e => e.type === "item" && !e.dead).map(e => [e.kind, Math.round(e.x), Math.round(e.y), e.w]);
    const enc = arr => { let s = ""; for (let i = 0; i < arr.length; i++) s += String.fromCharCode(48 + Math.round(clamp(arr[i], 0, 1) * 63)); return s; };
    const lanterns = EN.list.filter(e => e.type === "lantern").map(e => e.w);
    store("tsuzura.save.v1", { v: 1, x: P.x, y: P.y, stack: P.stack, tail: P.tail, self: P.self, tod: this.tod, day: this.day, flags: this.flags, found: [...this.found], count: this.count,
      stage: SITE.stage, have: SITE.have, items, near: enc(WD.near), wear: enc(WD.wear), kago: !!KAGOMARU.e, kagoItems: KAGOMARU.items, lanterns, story: STORY.stage });
  },
  load() { return store("tsuzura.save.v1"); },
  applySave(s) {
    const dec = (str, arr) => { if (!str) return; for (let i = 0; i < Math.min(str.length, arr.length); i++) arr[i] = (str.charCodeAt(i) - 48) / 63; };
    dec(s.near, WD.near); dec(s.wear, WD.wear); RD.uploadNear(true);
    this.tod = s.tod; this.day = s.day; this.flags = s.flags || {}; this.found = new Set(s.found || []); this.count = s.count || 3;
    SITE.stage = s.stage || 0; Object.assign(SITE.have, s.have || {});
    for (const e of EN.list) if (e.type === "item") { e.dead = true; e.gone = true; }
    for (const [k, x, y, w] of s.items || []) mkItem(k, x, y, { w });
    for (const e of EN.list) if (e.type === "offering" && this.found.has(e.idx)) { e.dead = true; e.gone = true; }
    const L = EN.list.filter(e => e.type === "lantern"); (s.lanterns || []).forEach((w, i) => { if (L[i]) L[i].w = w; });
    const P = PL.init(s.x, s.y); P.stack = s.stack || []; P.tail = s.tail || 0; P.self = s.self ?? 2; if (P.tail >= 6) P.form = "stone"; if (P.self <= 0) P.form = "leaf";
    if (s.kago) { KAGOMARU.wake(s.x + 20, s.y + 10); KAGOMARU.items = s.kagoItems || []; }
    STORY.stage = s.story || "free";
  },
};

const CINE = {

  until(fn) { return new Promise(r => { const chk = () => { if (fn()) r(); else after(.05, chk); }; chk(); }); },

const K_ = text => ({ who: "kago", text });
const N_ = text => ({ who: "narr", text });

const STORY = {
  stage: "title", barkCD: {}, areas: {}, radioN: 0,
  /* ================= PROLOGUE ================= */

    await CINE.say(T("count", "\u2026\u2026\u4e5d\u5341\u516d\u3002\u4e5d\u5341\u4e03\u3002"), T("thinking", "\u4e5d\u5341\u516b\u3002"));

/* =====================================================================
   VISTA \u2014 the side-view shots: the title, the treetop on the night of
   the Far (the plain, its lights, a procession of lanterns walking up
   into the sky, the pale wave), and the meadow lookout afterwards.
   Painted per frame into a low-res canvas, then graded and bloomed by
   the same composite as the world.
   ===================================================================== */
const VISTA = {
  cv: null, g: null, tex: null, on: false, mode: "title", t: 0, wave: -1, city: null, stars: null, hills: null,
  init() {
    this.cv = document.createElement("canvas"); this.g = this.cv.getContext("2d");
    const R = RNG(42);
    this.stars = []; for (let i = 0; i < 260; i++) this.stars.push([R(), Math.pow(R(), 1.6) * .62, R(), R() < .1 ? 2 : 1]);
    this.city = [];
    const districts = [[.5, .25, .09, 420], [.66, .4, .06, 220], [.34, .5, .07, 200], [.2, .2, .04, 90], [.8, .15, .05, 110], [.58, .7, .05, 120]];
    for (const [cx0, d0, sp, n] of districts) for (let i = 0; i < n; i++) this.city.push([cx0 + R.gauss() * sp, clamp(d0 + R.gauss() * sp * 1.6, 0, 1), R(), R() < .06 ? 2 : 1, R()]);
    for (let r = 0; r < 5; r++) { const x0 = R(), y0 = R() * .8, a = R.range(-.5, .5); for (let i = 0; i < 40; i++) this.city.push([x0 + i * .012 * Math.cos(a), clamp(y0 + i * .012 * Math.sin(a) * 2, 0, 1), R(), 1, .9]); }

      const u = (x - kx) / kw, top = ky + u * u * H * .1 + (hash2(x | 0, 1, 3) - .5) * 1.2;
      this.g.fillStyle = C.knoll; this.g.fillRect(x | 0, top | 0, 1, H);
      if (hash2(x | 0, 5, 1) < .35) this.g.fillRect(x | 0, (top - 1 - hash2(x | 0, 6, 1) * 2) | 0, 1, 3);
      else if (u < .1 || hash2(x | 0, 2, 3) < .3) { this.g.fillStyle = C.rim; this.g.fillRect(x | 0, top | 0, 1, 1); }
    }
    for (const [n, y0, y1, h0, h1] of [[110, .72, .8, .06, .1], [80, .8, .92, .1, .17], [44, .96, 1.06, .2, .3]]) {
      for (let k = 0; k < n; k++) {
        const bx = R() * W, by = H * (y0 + R() * (y1 - y0)), h = H * (h0 + R() * (h1 - h0)), lean = .2 + R() * .25;
        if (Math.abs(bx + h * lean * .6 - kx) < 18 && by > ky - 6) continue;           // leave her standing in the open
        for (let j = 0; j < 3; j++) { const sd = R() < .5 ? -1 : 1, L = h * (.3 + R() * .3); for (let i = 0; i < L; i++) { const t = i / L; this.px(bx + sd * t * t * L * .6, by - t * L * (1 - t * .55), C.blade); } }
        let x = bx, y = by; for (let i = 0; i < h; i++) { const t = i / h; x = bx + t * t * h * lean; y = by - i; this.px(x, y, C.stalk); }
        const pl = 4 + R() * 5 + h * .04;
        for (let sd = 0; sd < 3; sd++) for (let i = 0; i < pl; i++) { const t = i / pl; this.px(x + i * .9 + sd * .5, y - 1 + sd + t * t * pl * .7 + Math.sin(t * 3 + sd) * .5, t > .78 ? C.tip : sd === 0 ? C.lit : C.plume); }
      }
    }
    this.tsuzuraBack(kx | 0, ky + 1 | 0, N ? "#06070d" : "#22242c", N ? "#3a4670" : null);
  },
  tsuzuraBack(x, y, c, rim) { // a small silhouette from behind: round ears, the frame's poles, the tail; backlit by the moon
    const pts = ["...k.......k...", "..kkk.kkk.kkk..", "...kkkkkkkkk...", "...kkkkkkkkk...", "..kkkkkkkkkkk..", "..kkkkkkkkkkk..", "...kkkkkkkkk...", "....kkkkkkk....", "...kkkkkkkkk...", "...kkkkkkkkkk..", "...kkkkkkkkkkkk", "....kkkkkkkkkkk", "....kkkk.kkk.kk", "....kk....kk...", "....kk....kk..."];
    const S = new Set(), key = (i, j) => (i | 0) * 4096 + (j | 0);
    for (let j = 0; j < pts.length; j++) for (let i = 0; i < pts[j].length; i++) if (pts[j][i] === "k") S.add(key(x + i - 7, y + j - pts.length));
    for (let j = 0; j < 22; j++) { S.add(key(x - 5, y - 15 - j * .5 - 4)); S.add(key(x + 5, y - 15 - j * .5 - 4)); }
    for (const k of S) { const i = Math.floor(k / 4096), j = k - i * 4096; this.px(i, j, rim && j < y - 3 && (!S.has(key(i - 1, j)) || !S.has(key(i, j - 1))) ? rim : c); }
  },
  /* ---------- shots ---------- */
  async prologueShot() {
    this.on = true; this.mode = "treetop"; this.night = 1; this.wave = -1; this.procession = false; this.t = 0;
    await UI.fade(0, 1.8);
    await CINE.wait(1.6);
    this.procession = true; AU.festival(.7, { near: .3 });
    await CINE.wait(3.2);
    await CINE.say(T("surprised", "\u2026\u2026\u706f\uff0c\u5728\u5f80\u5929\u4e0a\u8d70\u3002"));
    await CINE.wait(1.2);
    AU.music("tension", { fade: 3 });
    const t0 = GAME.t; this.wave = 0;
    await CINE.until(() => { this.wave = clamp((GAME.t - t0) / 7, 0, 1) * .9; AU.festival(.7 + this.wave * .3, { near: .3 + this.wave * .6 }); return this.wave >= .9; });
    await CINE.say(T("shout", "\u5582\u2014\u2014\uff01"), T("shout", "\u90a3\u8fb9\u7684\u4eba\u2014\u2014"));
    await UI.fade(1, .5, "#dfe6f6");
    this.on = false;
  },
  async lookoutShot() {
    if (GAME.cine) return; GAME.cine = true;
    await UI.fade(1, .8); UI.showHud(false); this.on = true; this.mode = "lookout"; this.night = GAME.tod > 19.3 || GAME.tod < 5 ? 1 : 0; this.wave = 1; this.procession = this.night > .5; this.t = 0;
    await UI.fade(0, 1.2); AU.stinger("discover");
    await CINE.wait(2);
    if (this.night > .5) await CINE.say(T("soft", "\u2026\u2026\u90a3\u4e9b\u706f\u3002"), T("soft", "\u4e00\u76cf\u4e5f\u6ca1\u6709\u5c11\u3002"), T("thinking", "\u5168\u90fd\u53d8\u6210\u4e86\u8fdc\u5c71\u7684\u989c\u8272\u3002"));
    else await CINE.say(T("surprised", "\u2026\u2026\u57ce\u8fd8\u5728\u3002"), T("thinking", "\u5c4b\u9876\u3001\u70df\u56f1\u3001\u6cb3\u4e0a\u7684\u6865\uff0c\u4e00\u6837\u90fd\u6ca1\u5c11\u3002"), T("soft", "\u5c31\u662f\u5168\u90fd\u53d8\u6210\u4e86\u8fdc\u5c71\u7684\u989c\u8272\u3002"));
    await UI.fade(1, .8); this.on = false; UI.showHud(true); await UI.fade(0, .8);
    GAME.cine = false;
  },
};

/* ==== src/main.js ==== */
/* =====================================================================
   MAIN \u2014 boot (generate the art, raise the mountain), the title, the
   frame loop, the camera, pause.
   ===================================================================== */
if (typeof AU === "undefined") window.AU = new Proxy({}, { get: (o, k) => k === "ready" ? false : () => {} });
const APP = {
  cam: { x: 0, y: 0 }, paused: false, started: false,
  async boot() {
    UI.init();
    const ld = document.createElement("div"); ld.id = "loading"; ld.innerHTML = `<div class="k">\u30c4\u30c5\u30e9</div><div class="b"><i></i></div><div class="t">\u4e5d\u5341\u4e5d\u6298\u5ce0</div>`; document.getElementById("ui").appendChild(ld);
    const bar = ld.querySelector("i"), step = (k, msg) => new Promise(r => { bar.style.width = (k * 100) + "%"; if (msg) ld.querySelector(".t").textContent = msg; setTimeout(r, 30); });
    const cv = document.getElementById("cv");
    IN.init(cv); IN.onDevice = () => RD.resize();
    if (!RD.init(cv)) { ld.querySelector(".t").textContent = "\u8fd9\u53f0\u8bbe\u5907\u4e0d\u652f\u6301 WebGL2\u3002"; return; }
    await step(.08, "\u524a\u7af9 \u00b7 \u7f16\u7b3c");
    ARTREG.build(k => {});
    await step(.5, "\u8d77\u5c71 \u00b7 \u5f15\u6c34");
    WORLD.build(); WORLD.buildGrid();
    await step(.8, "\u70b9\u706f");
    RD.buildWorld(WD); VISTA.init();
    WORLDSETUP.base();
    await step(1, "");
    setTimeout(() => ld.remove(), 300);
    IN.onAny = () => { if (!AU.ready) { try { AU.init(); AU.resume(); } catch (e) { } } else AU.resume(); };
    this.loop();
    if (QS.skip) this.start(QS.skip === "free" ? "free" : QS.skip === "wake" ? "wake" : "new"); else this.title();
    if (QS.auto) after(1.5, () => { if (GAME.state === "title") { this.started = true; const t = document.getElementById("title"); t && t.remove(); this.start("new"); } });
  },
  /* ---------- title ---------- */
  title() {
    GAME.state = "title"; VISTA.on = true; VISTA.mode = "title"; VISTA.night = 1; VISTA.wave = -1; VISTA.procession = false;
    const hasSave = !!GAME.load();
    const t = document.createElement("div"); t.id = "title";
    t.innerHTML = `<div class="tt"><h1>\u30c4\u30c5\u30e9</h1><div><h2>\u9060\u56c3\u5b50</h2><div class="seal">\u4e5d\u5341<br>\u4e5d\u6298</div></div></div>
      <nav><button id="bNew">\u4ece\u5934\u5f00\u59cb</button>${hasSave ? `<button id="bCont">\u7ee7\u7eed\u65c5\u9014</button>` : ""}</nav><div class="hint">WASD \u79fb\u52a8 \u00b7 E \u62fe/\u8c03\u67e5 \u00b7 J \u53d6 \u00b7 K \u4e88 \u00b7 Q \u5378 \u00b7 Shift \u5954</div>`;
    document.getElementById("ui").appendChild(t);
    const btns = [...t.querySelectorAll("button")]; let sel = hasSave ? 1 : 0; const mark = () => btns.forEach((b, i) => b.classList.toggle("sel", i === sel)); mark();
    const go = which => { if (this.started) return; this.started = true; AU.init(); AU.resume(); AU.sfx("ui_ok"); t.style.opacity = 0; setTimeout(() => t.remove(), 1200); this.start(which); };
    document.getElementById("bNew").onclick = () => go("new"); if (hasSave) document.getElementById("bCont").onclick = () => go("cont");
    this.titleKeys = () => { if (IN.hit.up || IN.hit.down) { sel = (sel + 1) % btns.length; mark(); AU.sfx("ui_move"); } if (IN.hit.ok) go(sel === 0 ? "new" : "cont"); };
    UI.fade(0, 2);
    AU.music("title", { fade: 3 });
  },
  async start(which) {
    this.titleKeys = null;
    if (which === "cont") { const s = GAME.load(); if (s) { await UI.fade(1, 1); VISTA.on = false; WORLDSETUP.afterFar(); GAME.applySave(s); GAME.state = "play"; STORY.stage = "free"; GAME.noSave = false; UI.showHud(true); UI.countPop(GAME.count, null, true); AU.music("explore", { fade: 4 }); this.snapCam(); await UI.fade(0, 1.6); return; } }
    if (which === "free") { VISTA.on = false; WORLDSETUP.afterFar(); const [sx, sy] = LM.shrine; PL.init(+(QS.x || sx + 20), +(QS.y || sy + 40)); GAME.state = "play"; STORY.stage = "free"; GAME.flags.knowsWeight = true; GAME.flags.knowsLeaf = true; GAME.tod = +(QS.t || 9); UI.showHud(true); UI.countPop(GAME.count, null, true); this.snapCam(); UI.fade(0, .3); return; }
    if (which === "wake") { VISTA.on = false; GAME.state = "play"; GAME.tod = 6.3; STORY.wake().then(() => {}); this.snapCam(); return; }
    try { localStorage.removeItem("tsuzura.save.v1"); } catch (e) { }
    await UI.fade(1, 1.4); VISTA.on = false; AU.music("none", { fade: 1 });
    GAME.state = "play"; this.snapCam();
    STORY.prologue();
  },
  snapCam() { const P = PL.e; if (!P) return; this.cam.x = P.x; this.cam.y = P.y - P.z; },
  /* ---------- the loop ---------- */
  loop() {
    let last = performance.now(), frames = 0;
    const frame = () => {
      const now = performance.now(); let dt = Math.min(.05, (now - last) / 1000) * (+(QS.speed) || 1); last = now;
      try { this.tick(dt); } catch (e) { console.error(e && e.stack || e); }
      frames++; if (frames === (+(QS.frames) || 4)) window.DONE = true;
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  },
  tick(dt) {
    IN.update(dt);
    if (this.titleKeys) this.titleKeys();
    if (IN.hit.pause && GAME.state === "play" && !UI.dlg) this.togglePause();
    const run = !this.paused;
    if (run) { tickLater(dt); GAME.tick(dt); }
    RD.t = GAME.t;
    RD.box = damp(RD.box, GAME.boxT || 0, 4, dt);
    const env = RD.env = GAME.env();
    if (VISTA.on || GAME.state === "title") { if (run) VISTA.draw(dt); GL.canvasSub(VISTA.tex, VISTA.cv, true); RD.renderOverlay(VISTA.tex, VISTA.night > .5 ? .55 : .86); UI.update(dt); this.audio(dt, true); return; }
    if (GAME.state !== "play" || !PL.e) { RD.renderOverlay(VISTA.tex || ATLAS.tAlb); return; }
    if (run) {
      STORY.update(dt); PL.update(dt); EN.update(dt); FX.update(dt); FX.ambient(dt, env); NEARMAP.update(dt);
    }
    // camera: follow her with a little look-ahead, or obey the cinematic
    const P = PL.e; let tx, ty;
    if (GAME.camT) { tx = GAME.camT.x; ty = GAME.camT.y - GAME.camT.z; const k = GAME.camT.k; this.cam.x = k > 50 ? tx : damp(this.cam.x, tx, k, dt); this.cam.y = k > 50 ? ty : damp(this.cam.y, ty, k, dt); if (k > 50) GAME.camT.k = 2.5; }
    else { tx = P.x + P.vx * .35; ty = P.y - P.z - 14 + P.vy * .3 - PL.stackH() * .3; this.cam.x = damp(this.cam.x, tx, 4, dt); this.cam.y = damp(this.cam.y, ty, 4, dt); }
    RD.cam.shake = Math.max(0, RD.cam.shake - dt * 8);
    RD.setCamera(this.cam.x, this.cam.y);
    // the Far at the edges of sight
    const near = WORLD.nearAt(P.x, P.y); RD.farFx = damp(RD.farFx, clamp((.45 - near) / .4, 0, 1), 3, dt);
    // draw
    GHOSTS.draw(); EN.draw(); PL.draw(); PROLOGUE.draw(); ENDING.draw(); FX.draw();
    RD.render();
    UI.update(dt);
    this.audio(dt, false);
    if (!GAME.cine && GAME.state === "play" && !this.paused) { this.saveT = (this.saveT || 0) + dt; if (this.saveT > 20) { this.saveT = 0; GAME.save(); } }
  },
  audio(dt, vista) {
    if (!AU.ready) return;
    const P = PL.e; const env = RD.env;
    let s = { tod: GAME.tod, rain: env.rain, wind: env.wind[2], listener: { x: P ? P.x : 0, y: P ? P.y : 0 }, near: 1, biome: { forest: 0, bamboo: 0, stream: 0, meadow: 0, shrine: 0 }, water: 0, fall: 0, cinematic: GAME.cine, paused: this.paused, heavy: P ? P.tail / 6 : 0 };
    if (vista) { s.near = 1; s.biome.forest = .6; AU.update(dt, s); return; }
    if (P) {
      s.near = WORLD.nearAt(P.x, P.y);
      const Z = WD.zones; s.biome.forest = Z.cedarZone(P.x, P.y) ? 1 : .3; s.biome.bamboo = Z.bambooZone(P.x, P.y) ? 1 : 0; s.biome.meadow = Z.meadow(P.x, P.y) ? 1 : 0; s.biome.shrine = hyp(P.x - LM.shrine[0], P.y - LM.shrine[1]) < 140 ? 1 : 0;
      let wd = 999; for (let r = 8; r <= 120 && wd > 900; r += 16) for (let a = 0; a < 8; a++) if (WORLD.waterAt(P.x + Math.cos(a / 8 * TAU) * r, P.y + Math.sin(a / 8 * TAU) * r) > -500) { wd = r; break; }
      s.water = clamp(1 - wd / 130, 0, 1); s.biome.stream = s.water;
      s.fall = clamp(1 - hyp(P.x - LM.fallTop[0], P.y - LM.fallTop[1] - 40) / 260, 0, 1);
      if (STORY.stage === "free") AU.festival(clamp((.55 - s.near) / .5, 0, 1) * .8, { near: 0 });
    }
    AU.update(dt, s);
  },
  togglePause() {
    this.paused = !this.paused; AU.sfx(this.paused ? "ui_open" : "ui_close");
    if (this.paused) {
      const p = document.createElement("div"); p.id = "pause";
      p.innerHTML = `<div class="pn"><h3>\u5c0f\u61a9</h3><p><kbd>WASD</kbd> \u8d70 \u00b7 <kbd>Shift</kbd> \u5954\u8dd1 \u00b7 <kbd>E</kbd> \u80cc\u8d77 / \u8c03\u67e5 / \u732e\u7ed9\u7960</p><p><kbd>Q</kbd> \u653e\u4e0b\u6700\u4e0a\u9762\u7684\u4e1c\u897f \u00b7 <kbd>J</kbd> \u53d6\uff1a\u628a\u91cd\u91cf\u5438\u8fdb\u5c3e\u5df4 \u00b7 <kbd>K</kbd> \u4e88\uff1a\u628a\u91cd\u91cf\u4ea4\u7ed9\u522b\u7684\u4e1c\u897f</p>
        <p>\u5c3e\u5df4\u91cc\u88c5\u6ee1\u516d\u4efd\u91cd\u91cf\uff0c\u4f1a\u53d8\u6210\u77f3\u5934\u3002\u80cc\u5f97\u592a\u9ad8\u3001\u8dd1\u5f97\u592a\u5feb\uff0c\u80cc\u4e0a\u7684\u4e1c\u897f\u4f1a\u6389\u3002</p><p>\u7b2c ${GAME.day} \u65e5 \u00b7 ${String(Math.floor(GAME.tod)).padStart(2, "0")}:${String(Math.floor((GAME.tod % 1) * 60)).padStart(2, "0")} \u00b7 \u4f9b\u7269 ${kanjiNum(GAME.count)}</p>
        <button id="pRes">\u7ee7\u7eed</button><button id="pSave">\u8bb0\u4e0b</button></div>`;
      document.getElementById("ui").appendChild(p);
      p.querySelector("#pRes").onclick = () => this.togglePause(); p.querySelector("#pSave").onclick = () => { GAME.save(); UI.toast("\u8bb0\u4e0b\u4e86\u3002"); };
    } else { const p = document.getElementById("pause"); p && p.remove(); }
  },
};
addEventListener("load", () => { APP.boot().catch(e => { console.error(e && e.stack || e); document.title = "ERR " + e.message; window.DONE = true; }); });
