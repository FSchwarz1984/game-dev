<text x="600" y="70" style="font-size:13px;fill:var(--ink,#1b2030);">奥之院与「隔」铁塔</text>
<text x="600" y="85" style="font-size:11px;fill:var(--muted,#586074)">远化最深处，夜里铁塔亮红灯</text>
<text x="196" y="112" style="font-size:13px;fill:var(--ink,#1b2030);">风穴（冰室）</text>
<text x="196" y="127" style="font-size:11px;fill:var(--muted,#586074)">冷的来源，夏天也有冰</text>
<text x="660" y="140" style="font-size:13px;fill:var(--ink,#1b2030);">铁道隧道北口</text>
<text x="660" y="155" style="font-size:11px;fill:var(--muted,#586074)">信号所；内部是回声迷宫</text>
<text x="846" y="236" style="font-size:13px;fill:var(--ink,#1b2030);">废寺与无缘墓</text>
<text x="846" y="251" style="font-size:11px;fill:var(--muted,#586074)">シオン在这里</text>
<text x="140" y="220" style="font-size:13px;fill:var(--ink,#1b2030);">苔之山毛榉林</text>
<text x="140" y="235" style="font-size:11px;fill:var(--muted,#586074)">雾、木霊、生</text>
<text x="380" y="312" style="font-size:13px;fill:var(--ink,#1b2030);">裏見之瀑</text>
<text x="380" y="327" style="font-size:11px;fill:var(--muted,#586074)">可以走到瀑布背后的洞里</text>
<text x="392" y="352" style="font-size:13px;fill:var(--ink,#1b2030);font-weight:700;">大楠与道祖神</text>
<text x="392" y="367" style="font-size:11px;fill:var(--muted,#586074)">家：她的歩荷小屋</text>
<text x="604" y="392" style="font-size:13px;fill:var(--ink,#1b2030);font-weight:700;">九十九折宿（废宿场）</text>
<text x="604" y="407" style="font-size:11px;fill:var(--muted,#586074)">城镇建设的据点</text>
<text x="746" y="372" style="font-size:13px;fill:var(--ink,#1b2030);">竹林与炭窑</text>
<text x="746" y="387" style="font-size:11px;fill:var(--muted,#586074)">热；夜里很暗</text>
<text x="254" y="486" style="font-size:13px;fill:var(--ink,#1b2030);">吊桥</text>
<text x="254" y="501" style="font-size:11px;fill:var(--muted,#586074)">跨过峡谷</text>
<text x="56" y="590" style="font-size:13px;fill:var(--ink,#1b2030);">铁桥</text>
<text x="56" y="605" style="font-size:11px;fill:var(--muted,#586074)">隧道南口出来就是峡谷</text>
<text x="860" y="655" style="font-size:13px;fill:var(--ink,#1b2030);">温泉谷</text>
<text x="860" y="670" style="font-size:11px;fill:var(--muted,#586074)">热的来源，以后引成澡堂</text>
<text x="640" y="560" style="font-size:13px;fill:var(--ink,#1b2030);">溜池与水闸</text>
<text x="640" y="575" style="font-size:11px;fill:var(--muted,#586074)">梯田的水源</text>
<text x="610" y="744" style="font-size:13px;fill:var(--ink,#1b2030);">梯田与水车农家</text>
<text x="610" y="759" style="font-size:11px;fill:var(--muted,#586074)">开荒、种田</text>
<text x="306" y="728" style="font-size:13px;fill:var(--ink,#1b2030);">眺望岩</text>
<text x="306" y="743" style="font-size:11px;fill:var(--muted,#586074)">看见山下的平原</text>
<text x="586" y="812" style="font-size:13px;fill:var(--ink,#1b2030);">山路溶进远化之雾</text>
<text x="404" y="492" style="font-size:13px;fill:var(--ink,#1b2030);">隧道（地下贯通）</text>
<text x="866" y="336" style="font-size:13px;fill:var(--ink,#1b2030);">远化的碎片</text>
<text x="866" y="351" style="font-size:11px;fill:var(--muted,#586074)">浮在空中的岩石</text>
<text x="44" y="800" style="font-size:11px;fill:var(--g5,#2c4689);font-weight:700">虚线框：G5 垂直切片的范围</text>
