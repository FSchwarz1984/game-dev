<title id="cst">天岸与地岸的剖面示意</title>
<desc id="csd">上方倒挂着天岸，下方是地岸，中间是云的天海アワイ。两岸最近的山口就是关；一座关上立着「隔」塔把它锁住；地岸的灯与性质正升向天岸；一个戴笠的人影走在两道关之间，标着第一百道关。</desc>
